name: Сборка и Cydia-репозиторий

# main — исходники, gh-pages — опубликованный источник (пакеты всех версий и published.json).
# Сборка из ветки по умолчанию дописывает новые версии в gh-pages, а Pages публикует эту ветку
# (Settings → Pages → Deploy from a branch → gh-pages). Остальные сборки и пулл-реквесты
# только проверяют, что публикация пройдёт.

on:
  push:
    branches-ignore: [gh-pages]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4

      - name: Зависимости Theos
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential fakeroot rsync curl perl zip git libxml2 libtinfo6

      - name: Theos, iOS-тулчейн и SDK 10.3 (последний с armv7)
        run: |
          git clone --recursive --depth 1 --shallow-submodules https://github.com/theos/theos.git "$HOME/theos"
          curl -fsSL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz \
            | tar -xJ -C "$HOME/theos/toolchain"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
          git -C /tmp/sdks sparse-checkout set iPhoneOS10.3.sdk
          mv /tmp/sdks/iPhoneOS10.3.sdk "$HOME/theos/sdks/"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Сборка пакетов
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: debs
          path: debs/*.deb

      - name: Опубликованное из gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir site && cd site
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth 1 origin gh-pages; then
            git checkout -q -b gh-pages FETCH_HEAD
          else
            git symbolic-ref HEAD refs/heads/gh-pages # первая публикация: ветки ещё нет
          fi

      - name: Cydia-репозиторий
        env:
          S4E_REPO_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python3 scripts/make-repo.py debs site

      - name: Сохранить в gh-pages
        if: env.PUBLISH == 'true'
        run: |
          cd site
          git add -A
          if git diff --cached --quiet; then
            echo "Нового нет"
          else
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Публикация ${GITHUB_SHA::7}"
            git push -q origin gh-pages
          fi
